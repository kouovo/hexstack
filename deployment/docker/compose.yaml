# Local development infrastructure only. Placeholder credentials, never production settings.
name: app
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "6889:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6888:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Optional local MinIO. `pnpm infra:storage` waits for it and creates a private bucket.
  object-storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: [storage]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_MINIO_ACCESS_KEY:-app-local}
      MINIO_ROOT_PASSWORD: ${STORAGE_MINIO_SECRET_KEY:-app-local-development-only}
      MINIO_SITE_REGION: ${STORAGE_MINIO_REGION:-us-east-1}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Run explicitly as a disposable job, not a daemon included in `up --wait`.
  object-storage-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: [storage-init]
    depends_on:
      object-storage:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${STORAGE_MINIO_ACCESS_KEY:-app-local}
      MINIO_ROOT_PASSWORD: ${STORAGE_MINIO_SECRET_KEY:-app-local-development-only}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-app}
      STORAGE_MINIO_REGION: ${STORAGE_MINIO_REGION:-us-east-1}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://object-storage:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing --region "$$STORAGE_MINIO_REGION" "local/$$STORAGE_BUCKET"
        mc anonymous set none "local/$$STORAGE_BUCKET"

  # Optional local OpenTelemetry backend (Collector + Tempo + Prometheus + Loki + Grafana in one image).
  # `pnpm infra:otel`, then set OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318. Grafana: http://localhost:3300.
  otel-lgtm:
    image: grafana/otel-lgtm:0.40.0
    profiles: [observability]
    ports:
      - "127.0.0.1:3300:3000" # Grafana (web already uses 3000)
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
    volumes:
      - otel-lgtm-data:/data
      # Project dashboards (Dashboards → App → "API overview"), versioned in ./grafana/dashboards.
      - ./grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/app.yaml:ro
      - ./grafana/dashboards:/var/lib/grafana-dashboards/app:ro

volumes:
  postgres-data:
  minio-data:
  otel-lgtm-data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.250.0/24
